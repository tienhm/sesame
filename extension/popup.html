<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sesame Pass</title>
  <style>
    body {
      width: 240px;
      font-family: "Segoe UI", sans-serif;
      background: #1e1f26;
      color: #e8eaed;
      margin: 0;
      padding: 14px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
    }
    #status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #bullet {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ok   #bullet { background: #2ecc71; }
    .err  #bullet { background: #e74c3c; }
  </style>
</head>
<body>
  <h1 id="title">Sesame Pass</h1>
  <div id="status">
    <div id="bullet"></div>
    <span id="status-text">Checking…</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
