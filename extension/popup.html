<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sesame Pass</title>
  <style>
    body {
      width: 260px;
      font-family: "Segoe UI", sans-serif;
      background: #1e1f26;
      color: #e8eaed;
      margin: 0;
      padding: 14px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #adb5bd;
      margin-bottom: 4px;
    }
    select {
      width: 100%;
      box-sizing: border-box;
      background: #2e2f3a;
      color: #e8eaed;
      border: 1px solid #3a3b47;
      border-radius: 4px;
      padding: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    #status {
      font-size: 11px;
      margin-top: 6px;
      word-break: break-word;
    }
    .ok { color: #2d6a4f; }
    .err { color: #e74c3c; }
  </style>
</head>
<body>
  <h1>🔑 Sesame Pass</h1>

  <label for="browser-select">This browser</label>
  <select id="browser-select">
    <option value="chrome">Chrome</option>
    <option value="edge">Edge</option>
    <option value="brave">Brave</option>
    <option value="opera">Opera</option>
    <option value="firefox">Firefox</option>
  </select>

  <div id="status">Checking…</div>

  <script src="popup.js"></script>
</body>
</html>
